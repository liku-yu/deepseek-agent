[project]
name = "deepseek-agent"
version = "0.1.0"
description = "An extremely minimal DeepSeek agent (Responses API) that can run shell commands."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt-toolkit>=3.0.40",
]

[tool.uv]
# keep it simple: no package build for this script
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
